<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그러면 안 돼! 인권 지킴이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF6F8; --surface:#FFFFFF; --ink:#16233A; --muted:#52627A; --line:#C5D7E0;
  --thorn:#D93B36; --thorn-soft:#FDE4E2; --calm:#16875F; --calm-soft:#D6F2E7;
  --sun:#FFC247; --on-sun:#3B2A00; --accent:#2F52D0; --on-accent:#FFFFFF;
  --sky:#CDEAF6; --ground:#B5DDA4; --cloud:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1A2B; --surface:#19273D; --ink:#EAF1FA; --muted:#9DB0C8; --line:#2C3E5A;
    --thorn:#FF6B66; --thorn-soft:#3A1F26; --calm:#4FD1A5; --calm-soft:#123A2F;
    --sun:#FFC247; --on-sun:#3B2A00; --accent:#8AA5FF; --on-accent:#0F1A2B;
    --sky:#1C3552; --ground:#2B5A46; --cloud:#2C4A6B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1A2B; --surface:#19273D; --ink:#EAF1FA; --muted:#9DB0C8; --line:#2C3E5A;
  --thorn:#FF6B66; --thorn-soft:#3A1F26; --calm:#4FD1A5; --calm-soft:#123A2F;
  --sun:#FFC247; --on-sun:#3B2A00; --accent:#8AA5FF; --on-accent:#0F1A2B;
  --sky:#1C3552; --ground:#2B5A46; --cloud:#2C4A6B;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--ink);
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:clamp(16px, 1.1vw + 11px, 24px); line-height:1.45; word-break:keep-all;
}
button{font:inherit; color:inherit}
.app{position:relative; height:100%}
.screen{position:absolute; inset:0; display:flex; flex-direction:column; min-height:0}
.screen[hidden]{display:none}

/* ---------- 무대 (애니메이션 장면) ---------- */
.stage{position:relative; overflow:hidden; background:var(--sky); container-type:size; min-height:0}
.cloud{position:absolute; width:22cqw; height:7cqh; border-radius:99px; background:var(--cloud); opacity:.85}
.cloud::after{content:""; position:absolute; left:18%; top:-60%; width:46%; height:130%; border-radius:50%; background:inherit}
.cloud.c1{top:8%; left:-25cqw; animation:drift 46s linear infinite}
.cloud.c2{top:30%; left:-25cqw; width:16cqw; animation:drift 64s linear infinite; animation-delay:-28s}
@keyframes drift{to{transform:translateX(150cqw)}}
.ground{position:absolute; left:0; right:0; bottom:0; height:15%; background:var(--ground)}
.actor{position:absolute; bottom:9%; height:min(46cqh,50cqw); aspect-ratio:100/130}
.actor.left{left:7%}
.actor.right{right:7%}
.actor.mid{left:50%; margin-left:calc(min(32cqh,28cqw) * -0.3846); visibility:hidden}
.actor.mid.on{visibility:visible}
.stage.tri .actor{height:min(32cqh,28cqw); bottom:8%}
.stage.tri .actor.left{left:3%}
.stage.tri .actor.right{right:3%}
.stage.tri .prop{left:auto; right:3%; width:calc(min(32cqh,28cqw) * 0.77); bottom:calc(8% + min(32cqh,28cqw) + 1cqh); font-size:clamp(22px,8cqmin,48px)}
.mover{width:100%; height:100%; transform-origin:50% 100%}
.mover svg{width:100%; height:100%; overflow:visible; transform-origin:50% 100%; animation:bob 2.8s ease-in-out infinite}
.actor.right .mover svg{animation-delay:-1.4s}
@keyframes bob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
.actor.in.left{animation:inL .6s cubic-bezier(.2,.9,.3,1.15) both}
.actor.in.right{animation:inR .6s .1s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes inM{from{transform:translateY(130%)}to{transform:none}}
.actor.in.mid{animation:inM .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes inL{from{transform:translateX(-160%)}to{transform:none}}
@keyframes inR{from{transform:translateX(160%)}to{transform:none}}
.mover.jump{animation:jump .8s ease-out}
@keyframes jump{0%,100%{transform:translateY(0)}25%{transform:translateY(-16%)}50%{transform:translateY(0)}70%{transform:translateY(-8%)}}
.mover.cry{animation:cry .55s ease-in-out}
@keyframes cry{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}}
.prop{position:absolute; left:0; right:0; bottom:13%; text-align:center; font-size:clamp(28px,11cqmin,72px); line-height:1; animation:propbob 2.2s ease-in-out infinite}
@keyframes propbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8%)}}
.fx{position:absolute; inset:0; pointer-events:none}
.fx span{position:absolute; bottom:22%; font-size:clamp(18px,6cqmin,40px); animation:rise 1.5s ease-out forwards}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-62cqh) scale(1.2) rotate(25deg);opacity:0}}

/* 캐릭터 표정 */
.m{display:none}
svg[data-mood="neutral"] .m-neutral,
svg[data-mood="talk"] .m-talk,
svg[data-mood="sad"] .m-sad,
svg[data-mood="happy"] .m-happy,
svg[data-mood="brave"] .m-brave,
svg[data-mood="chat"] .m-chat,
svg[data-mood="sorry"] .m-sorry{display:inline}
svg[data-mood="happy"] .eyes{display:none}
.eyes{transform-box:fill-box; transform-origin:center; animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.mouth{transform-box:fill-box; transform-origin:center; animation:talk .34s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.tear{animation:tear 1.5s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(14px);opacity:0}}

/* ---------- 말풍선 ---------- */
.bubble{
  --bw:min(94cqw, 44cqh*1.515);
  position:absolute; top:4%; left:calc((100cqw - var(--bw)) / 2); width:var(--bw);
  aspect-ratio:100/66; transform-origin:25% 100%;
  transition:left .5s ease, top .5s ease, width .5s ease;
}
.bubble.mini{--bw:min(30cqw, 13cqh*1.515); left:2%; top:2%}
.bubble.mini .bubble-text{font-size:clamp(11px, 3.6cqmin, 22px)}
.bubble.b{--bw:min(94cqw, 46cqh*1.515); top:12%; transform-origin:50% 100%}
.bubble.is-voice .shape,.bubble.is-voice .tail{fill:var(--surface); stroke:var(--accent)}
.bubble-text b{font-weight:400; color:var(--accent)}
.bubble.hidden{visibility:hidden}
.bubble svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.bubble .shape,.bubble .tail{stroke-width:1.1; stroke-linejoin:round; transition:fill .5s, stroke .5s}
.bubble.is-thorn .shape,.bubble.is-thorn .tail{fill:var(--thorn-soft); stroke:var(--thorn)}
.bubble.is-calm .shape,.bubble.is-calm .tail{fill:var(--calm-soft); stroke:var(--calm)}
.bubble-text{
  position:absolute; inset:17% 14%; margin:0; display:flex; align-items:center; justify-content:center;
  text-align:center; font-size:calc(clamp(14px, 4.5cqmin, 30px) * var(--k, 1)); line-height:1.35;
}
.bubble.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.15);opacity:0}to{transform:scale(1);opacity:1}}
.bubble.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.bubble.pulse{animation:pulse .5s}
@keyframes pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}

/* ---------- 공통 버튼 ---------- */
.btn{
  display:inline-block; border:0; cursor:pointer; background:var(--accent); color:var(--on-accent);
  padding:.7em 1.5em; border-radius:16px; font-size:1.15rem; min-height:48px;
}
.btn.big{font-size:1.35rem; padding:.7em 1.9em}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.icon:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
.chip{
  border:2px solid var(--line); background:var(--surface); border-radius:99px; padding:.25em 1em;
  cursor:pointer; min-height:44px;
}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:var(--on-accent)}
.icon{border:0; background:transparent; cursor:pointer; font-size:1.25rem; min-width:44px; min-height:44px; border-radius:12px}

/* ---------- 시작 ---------- */
.start{flex-direction:column}
#heroStage{flex:1 1 0; min-height:180px}
.start-body{padding:14px 20px 20px; text-align:center; overflow:auto; max-height:56%}
.start-body h1{margin:0; font-weight:400; font-size:clamp(34px, 6vw + 8px, 68px); line-height:1.1}
.tag{margin:6px auto 12px; color:var(--muted); max-width:34ch}
.how{margin:0 auto 14px; max-width:38ch}
.picker{display:flex; gap:8px; justify-content:center; margin-bottom:14px; flex-wrap:wrap}
.picker[hidden]{display:none}
.src{margin:14px 0 0; color:var(--muted); font-size:.85rem}
.start-body .btn{align-self:center}

/* ---------- 게임 ---------- */
.play{display:grid; grid-template-rows:auto minmax(0,1fr) auto}
.hud{display:flex; align-items:center; gap:10px; padding:8px 10px 8px 16px; background:var(--bg)}
.count{min-width:4.4em}
.segs{flex:1; display:flex; gap:3px}
.seg{flex:1; height:8px; border-radius:99px; background:var(--line)}
.seg.done{background:var(--calm)}
.seg.now{background:var(--accent)}
.score{min-width:3.6em; text-align:right}
#stage{min-height:0}
.panel{overflow:auto; max-height:56vh; max-height:56dvh; padding:12px 16px 16px; background:var(--bg); display:flex; flex-direction:column}
.panel-in{margin:auto 0; width:100%; max-width:760px; align-self:center}
.pill{display:inline-block; background:var(--sun); color:var(--on-sun); border-radius:99px; padding:1px 12px; font-size:.85rem; margin-bottom:4px}
.q{margin:0 0 10px; font-size:1.2rem; line-height:1.35}
.options{display:grid; gap:9px}
.opt{
  width:100%; text-align:left; cursor:pointer; background:var(--surface); border:2px solid var(--line);
  border-radius:14px; padding:.6em .9em; font-size:1rem; line-height:1.4;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.wrong{border-color:var(--thorn); background:var(--thorn-soft); opacity:.9}
.opt.wrong::before{content:"✕ "; color:var(--thorn)}
.opt.right{border-color:var(--calm); background:var(--calm-soft)}
.opt.right::before{content:"✓ "; color:var(--calm)}
.opt.dim{opacity:.55}
.fb{margin-top:12px; border-radius:18px; border:2px solid; padding:12px 14px}
.fb.good{border-color:var(--calm); background:var(--calm-soft)}
.fb.bad{border-color:var(--thorn); background:var(--thorn-soft)}
.fb.wait{border-color:var(--line); background:var(--surface)}
.write{
  display:block; width:100%; min-height:4.6em; resize:vertical; background:var(--surface); color:var(--ink);
  border:2px solid var(--line); border-radius:14px; padding:.6em .8em; font:inherit; line-height:1.4;
}
.write:focus-visible{outline:3px solid var(--sun); outline-offset:2px; border-color:var(--accent)}
.note{margin:8px 0 0; color:var(--muted); font-size:.8em}
.quote{margin:0 0 8px; padding:8px 12px; border-left:4px solid var(--line); background:var(--surface); border-radius:10px; font-size:.95em}
.quote .ctx{color:var(--muted); font-size:.85em; margin-bottom:4px}
.quote .dl{margin:3px 0}
.quote .dl b{font-weight:400; color:var(--accent)}
.quote .fr{background:var(--thorn-soft); border-radius:8px; padding:2px 8px}
.quote .fr b{color:var(--thorn)}
.quote[hidden]{display:none}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:10px}
.link{background:none; border:0; cursor:pointer; color:var(--muted); text-decoration:underline; padding:8px 4px; min-height:44px}
.link:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
.fb strong{display:block; font-size:1.1em; font-weight:400}
.fb p{margin:0}
.fb .btn{margin-top:10px}

/* ---------- 결과 ---------- */
.end{overflow-y:auto; flex-direction:column}
#endStage{flex:0 0 auto; width:min(100%,760px); margin:0 auto; height:clamp(280px,46vh,440px); height:clamp(280px,46dvh,440px); border-radius:0 0 28px 28px}
#endStage .bubble-text{font-size:clamp(16px,7.5cqmin,36px)}
.end-body{padding:12px 20px 40px; text-align:center; width:100%; max-width:760px; margin:0 auto}
.big{font-size:clamp(54px,9vw,88px); line-height:1.1; margin:0}
.big small{font-size:.3em; color:var(--muted)}
.best{color:var(--muted); margin:0 0 6px}
.msg{max-width:34ch; margin:6px auto 16px}
.recap-h{margin:26px 0 2px; font-size:1.3rem; font-weight:400}
.recap-sub{margin:0 0 10px; color:var(--muted); font-size:.9rem}
.recap{text-align:left; margin:0; padding:0; list-style:none; display:grid; gap:10px}
.recap li{background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:10px 14px}
.recap p{margin:0; padding:2px 0}
.lbl{display:inline-block; font-size:.78rem; border-radius:99px; padding:0 10px; margin-right:8px}
.recap .no .lbl{background:var(--thorn-soft); color:var(--thorn); border:1.5px solid var(--thorn)}
.recap .yes .lbl{background:var(--calm-soft); color:var(--calm); border:1.5px solid var(--calm)}

/* ---------- 가로 화면(칠판·TV) ---------- */
@media (min-width:820px) and (min-aspect-ratio:5/4){
  .start{flex-direction:row}
  #heroStage{flex:1.2 1 0}
  .start-body{flex:.8 1 0; max-height:none; display:flex; flex-direction:column; justify-content:center; padding:24px 32px}
  .play{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); grid-template-rows:auto minmax(0,1fr)}
  .hud{grid-column:1/-1}
  .panel{max-height:none; padding:20px 30px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<main class="app">

  <!-- 시작 -->
  <section id="start" class="screen start">
    <div id="heroStage"></div>
    <div class="start-body">
      <h1>그러면 안 돼!<br>인권 지킴이</h1>
      <p class="tag">가시 돋친 말 앞에서, 용기 있게 나서 주세요.</p>
      <p class="how">모두 21개 장면이에요. 1단계에서 친구의 말이 왜 인권을 침해하는지 찾고, 2단계에서 ‘나’가 되어 ‘그러면 안 돼.’ 말풍선을 채워요.</p>
      <div class="picker" id="modeRow" role="group" aria-label="방식" hidden>
        <button class="chip" type="button" data-mode="card" aria-pressed="true">카드 고르기</button>
        <button class="chip" type="button" data-mode="write" aria-pressed="false">내 말로 고쳐 쓰기 ✏️</button>
      </div>
      <button class="btn big" id="startBtn" type="button">용기 내어 출발!</button>
      <p class="src">5학년 도덕 · 인권, 나와 우리부터 (교과서 78~81쪽)</p>
    </div>
  </section>

  <!-- 게임 -->
  <section id="play" class="screen play" hidden>
    <header class="hud">
      <span class="count" id="count">1 / 20</span>
      <div class="segs" id="segs" aria-hidden="true"></div>
      <span class="score" id="score">0점</span>
      <button class="icon" id="soundBtn" type="button" aria-label="소리 끄기">🔊</button>
      <button class="icon" id="fsBtn" type="button" aria-label="전체 화면">⛶</button>
    </header>
    <div id="stage"></div>
    <div class="panel">
      <div class="panel-in">
        <span class="pill" id="stepLabel">1단계</span>
        <p class="quote" id="quoteBox" hidden></p>
        <p class="q" id="question"></p>
        <div class="options" id="options"></div>
        <div id="fb" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="end" class="screen end" hidden>
    <div id="endStage"></div>
    <div class="end-body">
      <p class="big"><span id="endScore">0</span><small> / <span id="endMax">420</span>점</small></p>
      <p class="best" id="best"></p>
      <p class="msg" id="endMsg"></p>
      <button class="btn big" id="againBtn" type="button">다시 하기</button>
      <h3 class="recap-h">오늘의 인권 지킴이 말</h3>
      <p class="recap-sub">인권 보호 안내문을 만들 때 그대로 써 봐도 좋아요.</p>
      <ul class="recap" id="recap"></ul>
    </div>
  </section>

</main>

<script>
(function(){
"use strict";

/* ====== 문제 데이터 ======
   rs: 1단계 이유 선택지 (0번이 정답) / fix: 정답 바꿔 말하기 / fs: [틀린 말, 왜 틀렸는지]
   sp, li: 말하는 사람·듣는 사람 (kid | adult | elder) / prop: 장면 이모지 / diff: 피부색 차이 장면 */
var ITEMS = [
  { scene:"쉬는 시간, 친구가 책상에 엎드려 울고 있어요.", prop:"😢",
    q:"남자가 울긴 왜 울어? 남자는 씩씩해야지!",
    rs:["성별을 이유로 감정을 표현하지 못하게 하고, 사람을 다르게 대하기 때문이에요.",
        "친구가 울면 다른 사람들이 걱정하기 때문이에요.",
        "교실에서는 조용히 말해야 하기 때문이에요."],
    fix:"무슨 일 있었어? 울고 싶을 땐 울어도 괜찮아.",
    fs:[["남자든 여자든 우는 건 부끄러운 일이야.","우는 것을 부끄러운 일로 만들어 마음을 더 힘들게 해요."],
        ["그만 울고 저리 가. 시끄러워.","친구의 마음을 무시하는 말이에요."]] },

  { scene:"모둠 활동 중, 친구가 종이접기를 어려워해요.", prop:"📄",
    q:"이것도 못 하니? 너 바보냐?",
    rs:["상대방의 마음과 인격을 존중하지 않는 표현이기 때문이에요.",
        "활동 시간이 부족해지기 때문이에요.",
        "수업 시간에는 말을 하면 안 되기 때문이에요."],
    fix:"어렵지? 나도 처음엔 그랬어. 같이 해 볼까?",
    fs:[["이것도 못 하니? 연습 좀 하고 와.","‘이것도 못 하니’가 그대로 들어 있어요. 상대를 깎아내리는 말이에요."],
        ["그냥 내가 다 할게. 넌 가만히 있어.","친구가 참여할 기회를 빼앗고 무시하는 말이 될 수 있어요."]] },

  { scene:"전학 온 친구가 다른 나라에서 왔다고 소개했어요.", prop:"🌏",
    q:"그 나라 사람들은 원래 다 그래.",
    rs:["특정 집단에 대한 편견을 갖게 만들기 때문이에요.",
        "친구의 소개 시간이 길어지기 때문이에요.",

      g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.19);
      t += 0.12;
    });
  }catch(e){}
}

/* ====== 말풍선 (가시 → 둥글게) ====== */
var N = 72, CX = 50, CY = 33, RX = 46.5, RY = 29.5;
var SPIKE = [1, 0.88, 0.74, 0.88], SMOOTH = 0.9;
function bubblePoints(t){
  var pts = [];
  for (var i = 0; i < N; i++){
    var a = (i / N) * Math.PI * 2 - Math.PI / 2;
    var f = SPIKE[i % 4] * (1 - t) + SMOOTH * t;
    pts.push((CX + Math.cos(a) * RX * f).toFixed(2) + "," + (CY + Math.sin(a) * RY * f).toFixed(2));
  }
  return pts.join(" ");
}
function Bubble(el){
  this.el = el;
  this.poly = $(".shape", el);
  this.textEl = $(".bubble-text", el);
  this.t = 0; this.anim = 0; this.typer = 0;
  this.draw();
}
Bubble.prototype.draw = function(){ this.poly.setAttribute("points", bubblePoints(this.t)); };
Bubble.prototype.setState = function(calm){
  this.el.classList.toggle("is-calm", calm);
  this.el.classList.toggle("is-thorn", !calm);
};
Bubble.prototype.set = function(t){
  cancelAnimationFrame(this.anim);
  this.t = t; this.draw(); this.setState(t >= 1);
};
Bubble.prototype.hide = function(){ clearInterval(this.typer); this.textEl.textContent = ""; this.el.classList.add("hidden"); this.el.classList.remove("pop"); };
Bubble.prototype.popIn = function(){ this.el.classList.remove("hidden"); restart(this.el, "pop", 700); };
Bubble.prototype.type = function(text){
  var self = this;
  clearInterval(this.typer);
  var n = text.length;
  this.el.style.setProperty("--k", n <= 24 ? 1 : n <= 34 ? 0.88 : n <= 44 ? 0.78 : 0.7);
  if (reduceMotion()){ this.textEl.textContent = text; return; }
  var i = 0;
  this.textEl.textContent = "";
  this.typer = setInterval(function(){
    i++;
    self.textEl.textContent = text.slice(0, i);
    if (i >= text.length) clearInterval(self.typer);
  }, 32);
};
/* 용기 있는 친구의 말풍선: ‘그러면 안 돼.’ + 학생이 쓴 말 */
Bubble.prototype.voice = function(text, hon){
  var el = this.textEl;
  el.textContent = "";
  var wrap = document.createElement("span");
  var b = document.createElement("b"); b.textContent = hon ? "그러면 안 돼요." : "그러면 안 돼.";
  wrap.appendChild(b);
  wrap.appendChild(document.createTextNode(" " + (text || "…")));
  el.appendChild(wrap);
  var n = (text || "").length + 8;
  this.el.style.setProperty("--k", n <= 26 ? 1 : n <= 40 ? 0.86 : n <= 55 ? 0.76 : 0.68);
};
Bubble.prototype.calm = function(){ this.el.classList.remove("is-voice"); this.el.classList.add("is-calm"); };
Bubble.prototype.mini = function(){ clearInterval(this.typer); this.el.classList.add("mini"); this.textEl.textContent = "💢"; };
Bubble.prototype.morph = function(to){
  var self = this;
  cancelAnimationFrame(this.anim);
  this.setState(to >= 1);
  if (reduceMotion()){ this.t = to; this.draw(); return; }
  var from = this.t, start = performance.now(), dur = 800;
  function ease(p){ var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
  function step(now){
    var p = Math.min(1, (now - start) / dur);
    self.t = from + (to - from) * ease(p);
    self.draw();
    if (p < 1) self.anim = requestAnimationFrame(step);
    else { self.t = to; self.draw(); }
  }
  this.anim = requestAnimationFrame(step);
};

var DIRECTED = /(바보|멍청|찐따|돼지|뚱뚱|못생|한심)(야|아|이야|냐|같|새끼|이네|인가)/;
var THREAT = /너때문|네탓|안하면|안그러면|쫓아|혼날|이를거|일러줄|네가잘못|니가잘못|네잘못|너잘못/;
var REASON_RE = /상처|기분(이|을|도)?(나쁘|나빠|상하|상해|안좋|생각|헤아|살피)|속상|아프|아파|슬프|슬퍼|힘들|마음(이|을|에|도)?(아프|아파|상처|다치|불편|생각|헤아|살피)|(친구|상대|남|걔)(의)?마음|아픈|아픔|슬픈|슬픔|힘든|인권|존중|차별|편견|권리|불편|불공평|싫어하|싫어할|싫어해|소중|무서|외로|창피|자존심|괴로|눈물|나쁜|나쁘|잘못|옳지|못된|예의|억지|강요|부당|무시하는|무시하면|무시당|무시받|놀리|괴롭|따돌|폭력|비난|모욕|소외|외톨|배제|느끼|느껔|느낄|서운|섭섭|억울|위축|주눅|무안|불쾌|외면|왕따|존엄|평등|공평|동등|자신감|불안|위험|안전|피해|해로|다칠|다쳐|두렵|감정|싫다고|사람마다/;
var ALT_RE = /해야|하자|하지말|말자|말고|해줘|해주자|합시다|사과|도와|같이|함께|물어|허락|동의|이해|배려|그만|고치|알려|야돼|야해|스스로|직접|조심|지키|바꾸|바꿔|양보|부탁|노력|포함|초대|끼워|넣어|넣자|함께해|같이해|지켜|만들자|참여|어울|야지|줘야|드려야|지워|삭제|취소|주세요|주셔야|하셔야|해요|드릴게요/;
function norm(s){ return String(s).toLowerCase().replace(/[\s.,!?~…·"'“”‘’()\[\]\-]/g, ""); }
function hasAny(t, list){ for (var i = 0; i < list.length; i++){ if (t.indexOf(list[i]) >= 0) return true; } return false; }
function bigrams(t){ var m = {}; for (var i = 0; i < t.length - 1; i++) m[t.substr(i, 2)] = 1; return m; }
function similar(a, b){
  var A = bigrams(a), B = bigrams(b), inter = 0, uni = 0, k;
  for (k in A){ uni++; if (B[k]) inter++; }
  for (k in B){ if (!A[k]) uni++; }
  return uni ? inter / uni : 0;
}
/* 글자를 보고 판단하는 간이 판정: { level: great | almost | retry, praise, tip }
   학생이 쓴 말 = ‘그러면 안 돼.’ 다음에 이어 쓴 말.  좋은 말 = 이유(마음·권리) + 해야 할 행동 */
/* 문장이 모두 존댓말(~요, ~니다 …)로 끝나는지 */
function isInformal(raw){
  var sents = String(raw).split(/[.!?~…]+/);
  for (var i = 0; i < sents.length; i++){
    var x = sents[i].replace(/[\s"'“”‘’)]+$/g, "").replace(/^[\s"'“”‘’(]+/, "");
    if (x.length < 3) continue;
    if (!/(요|니다|니까|죠|시다|시오)$/.test(x)) return true;
  }
  return false;
}
function judgeText(it, raw){
  var j = it.j;
  /* 욕설은 길이와 상관없이 가장 먼저 확인 (띄어쓰기·숫자·기호로 숨겨도 찾음) */
  var strict = String(raw).toLowerCase().replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z]/g, "");
  if (hasAny(strict, HARD)){
    return { level:"retry", praise:"", tip:"이 말에는 친구에게 상처가 될 수 있는 표현이 들어 있어요. 친구가 들어도 기분 좋은 말로 써 볼까요?" };
  }
  var t = norm(raw).replace(/^그러면안돼/, "");
  var syl = (t.match(/[가-힣]/g) || []);
  var uniq = {}; syl.forEach(function(c){ uniq[c] = 1; });
  if (syl.length < 4 || Object.keys(uniq).length < 3){
    return { level:"retry", praise:"", tip:"조금 더 자세히 써 볼까요? 왜 안 되는지, 어떻게 해야 하는지를 한 문장으로 써 주세요." };
  }
  if (DIRECTED.test(t)){
    return { level:"retry", praise:"", tip:"친구를 놀리거나 깎아내리는 말이 들어 있어요. 차분하게 이유를 설명해 볼까요?" };
  }
  if (similar(t, norm(it.q)) >= 0.7){
    return { level:"retry", praise:"", tip:"친구가 한 말을 그대로 썼어요. 그 말에 맞서는 나만의 말을 써 볼까요?" };
  }
  if (THREAT.test(t)){
    return { level:"almost", praise:"", tip:"친구를 탓하거나 겁주기보다, 왜 안 되는지 차분히 설명해 볼까요?" };
  }
  var tr = t.replace(/마음대로/g, "");
  var reason = REASON_RE.test(tr), alt = ALT_RE.test(tr) || /[가-힣]자(?=[\s.,!?~]|$)/.test(String(raw)), key = hasAny(tr, j.ok);
  /* 이유만 써도 ‘잘했어요’. 이유 + 해야 할 행동이면 더 좋은 말 */
  if (it.hon && (reason || (alt && key)) && isInformal(raw)){
    return { level:"almost", praise:"왜 안 되는지, 어떻게 해야 하는지 잘 생각했어요.", tip:"어른께 말하는 거니까 존댓말로 써 볼까요? 문장 끝을 ‘~요’로 바꿔 보세요." };
  }
  if (reason || (alt && key)){
    var praise = reason ? "왜 안 되는지 상대의 마음이나 권리로 설명했어요." : "어떻게 해야 하는지 알려 줬어요.";
    if (reason && (alt || key)) praise += " 어떻게 해야 하는지도 알려 줬어요.";
    else if (reason) praise += " 어떻게 해야 하는지도 덧붙이면 더 좋아요.";
    return { level:"great", praise:praise, tip:"" };
  }
  if (alt || key){
    return { level:"almost", praise:"어떻게 하면 좋은지 알려 줬어요.", tip:"왜 그러면 안 되는지, 상대의 마음이나 권리도 넣어 볼까요?" };
  }
  return { level:"retry", praise:"", title:"조금만 더 써 볼까요?", tip:"도우미가 잘 이해하지 못했을 수 있어요. ‘마음’, ‘상처’, ‘차별’처럼 이유가 분명히 드러나는 말을 넣어 볼까요? " + j.hint };
}

function submitWrite(it, ta, send){
  if (locked || busy) return;
  var text = ta.value.replace(/\s+/g, " ").trim();
  if (!text){ showFb("bad", "먼저 써 보세요", "‘" + (it.hon ? "그러면 안 돼요." : "그러면 안 돼.") + "’ 다음에 이어질 말을 한 줄 써 주세요."); return; }
  busy = true;
  var tk = token;
  send.disabled = true; ta.readOnly = true;
  send.textContent = "도우미가 읽는 중…";
  showFb("wait", "도우미가 살펴보고 있어요", "잠깐만 기다려 주세요.");
  function reopen(){
    busy = false; send.disabled = false; ta.readOnly = false; send.textContent = "다시 보내기";
  }
  setTimeout(function(){
    if (tk !== token) return;
    judged(it, text, judgeText(it, text), ta, send, reopen);
  }, reduceMotion() ? 0 : 600);
}

/* 성공(또는 도움) 연출: 용기 있는 말에 친구가 미안해하고, 모두가 웃어요 */
function celebrate(sentence, hon){
  stage.bubbleB.voice(sentence, hon);
  stage.bubbleB.calm();
  stage.bubble.textEl.textContent = "미안해!";
  stage.bubble.morph(1);
  stage.mood("L", "sorry"); stage.mood("R", "happy"); stage.mood("M", "happy");
  stage.react("R", "jump", 900); stage.react("M", "jump", 900);
}

function judged(it, text, r, ta, send, reopen){
  var level = String(r.level || "retry");
  var praise = String(r.praise || "").slice(0, 200);
  var tip = String(r.tip || "").slice(0, 200);
  if (level === "great"){
    locked = true; busy = false;
    var p = [10, 5, 0][Math.min(wrong, 2)];
    roundPts += p; score += p;
    $("#score").textContent = score + "점";
    ta.readOnly = true; send.disabled = true; send.textContent = "완료";
    tone([660, 880]);
    celebrate(text, it.hon);
    stage.burst(["✨", "💚", "🌟", "🌈"], 12);
    log.push({ it: it, pts: roundPts, mine: (it.hon ? "그러면 안 돼요. " : "그러면 안 돼. ") + text });
    var lastG = idx === rounds - 1;
    showFb("good", "용기 있게 말했어요! +" + p + "점",
      praise || "상대의 마음과 권리를 지키는 말이에요.",
      lastG ? "결과 보기" : "다음 문제", nextRound);
    return;
  }
  wrong++;
  if (wrong >= 3){
    locked = true; busy = false;
    ta.readOnly = true; send.disabled = true; send.textContent = "완료";
    tone([440, 523]);
    celebrate(it.ex, it.hon);
    log.push({ it: it, pts: roundPts });
    var last3 = idx === rounds - 1;
    showFb("good", "도우미가 도와줄게요",
      "이렇게 말해 볼 수 있어요: “" + (it.hon ? "그러면 안 돼요. " : "그러면 안 돼. ") + it.ex + "” 다음 문제에서 또 도전해 봐요.",
      last3 ? "결과 보기" : "다음 문제", nextRound);
    return;
  }
  reopen();
  restart(stage.bubbleB.el, "shake", 500);
  stage.react("R", "cry", 700);
  tone([220]);
  var title = r.title || (level === "almost" ? "거의 다 왔어요!" : "다시 생각해 봐요");
  var msg = (praise + " " + tip).trim();
  showFb("bad", title, msg || "상대의 마음과 권리를 떠올리며 다시 써 볼까요?");
}

function choose(o, btn){
  if (locked) return;
  var it = order[idx];
  if (o.ok){
    locked = true;
    var p = [10, 5, 0][Math.min(wrong, 2)];
    roundPts += p; score += p;
    $("#score").textContent = score + "점";
    btn.classList.add("right");
    var all = $("#options").children;
    for (var i = 0; i < all.length; i++){
      all[i].disabled = true;
      if (all[i] !== btn && !all[i].classList.contains("wrong")) all[i].classList.add("dim");
    }
    tone([660, 880]);
    if (step === 1){
      restart(stage.bubble.el, "pulse", 600);
      stage.react("R", "cry", 700);
      showFb("good", "맞아요! +" + p + "점",
        "이 말은 상대의 마음과 권리를 해치는 ‘가시 돋친 말’이에요. 이제 ‘나’가 되어 용기 있게 말해 볼까요?",
        "나서 보기", toStep2);
    } else {
      stage.bubble.type(it.fix);
      stage.bubble.morph(1);
      stage.mood("L", "happy"); stage.mood("R", "happy");
      stage.react("L", "jump", 900); stage.react("R", "jump", 900);
      stage.burst(["✨", "💚", "🌟", "🌈"], 12);
      log.push({ it: it, pts: roundPts });
      var last = idx === rounds - 1;
      showFb("good", "말이 둥글어졌어요! +" + p + "점",
        "이렇게 말하면 상대의 마음과 권리를 지킬 수 있어요.",
        last ? "결과 보기" : "다음 문제", nextRound);
    }
  } else {
    wrong++;
    btn.disabled = true;
    btn.classList.add("wrong");
    restart(stage.bubble.el, "shake", 500);
    stage.react("R", "cry", 700);
    tone([220]);
    showFb("bad", "다시 생각해 봐요",
      o.why || "이 이유는 아니에요. 말을 들은 친구의 마음과 권리를 떠올려 보세요.");
  }
}

function nextRound(){
  idx++;
  if (idx >= rounds) endGame(); else renderRound();
}

function endGame(){
  token++;
  show("end");
  var max = rounds * 20, best = 0;
  try{ best = parseInt(localStorage.getItem(BEST_KEY + "-" + rounds), 10) || 0; }catch(e){}
  var isNew = score > best;
  if (isNew){ best = score; try{ localStorage.setItem(BEST_KEY + "-" + rounds, String(score)); }catch(e){} }

  var r = score / max, title, msg;
  if (r >= 0.9){ title = "인권 지킴이 대장!"; msg = "거의 모든 장면에서 용기 있게 나섰어요. 친구들에게도 알려 주세요!"; }
  else if (r >= 0.7){ title = "인권 지킴이!"; msg = "말이 가진 힘을 잘 알고 있어요. 조금만 더 하면 대장이 될 수 있어요."; }
  else if (r >= 0.45){ title = "인권 지킴이 견습생"; msg = "아래 ‘오늘의 인권 지킴이 말’을 읽고 다시 도전해 봐요."; }
  else { title = "다시 도전해 봐요"; msg = "괜찮아요. 아래 ‘오늘의 인권 지킴이 말’을 읽고 다시 해 보면 훨씬 쉬워져요."; }

  endStage.cast([mk("kid", pick(SKINS), SHIRTS[1]), mk("kid", pick(SKINS), SHIRTS[3])], "🏆");
  endStage.mood("L", "happy"); endStage.mood("R", "happy");
  endStage.enter();
  endStage.bubble.set(1);
  endStage.bubble.hide();
  setTimeout(function(){ endStage.bubble.popIn(); endStage.bubble.type(title); }, 450);
  setTimeout(function(){
    endStage.react("L", "jump", 900); endStage.react("R", "jump", 900);
    endStage.burst(["🎉", "✨", "💚", "🌟"], 18);
  }, 700);

  $("#endScore").textContent = score;
  $("#endMax").textContent = max;
  $("#best").textContent = isNew ? "새 최고 점수예요!" : "내 최고 점수 " + best + "점";
  $("#endMsg").textContent = msg;
  $("#end").scrollTop = 0;

  var ul = $("#recap");
  ul.innerHTML = "";
  log.forEach(function(r){
    var li = document.createElement("li");
    li.appendChild(line("no", "이렇게 하지 말아요.", "“" + r.it.q + "”"));
    li.appendChild(line("yes", r.mine ? "내가 한 말" : "이렇게 해 주세요.", "“" + (r.mine || r.it.fix) + "”"));
    ul.appendChild(li);
  });
  tone([523, 659, 784, 1047]);
}
function line(cls, label, text){
  var p = document.createElement("p");
  p.className = cls;
  var l = document.createElement("span"); l.className = "lbl"; l.textContent = label;
  p.appendChild(l);
  p.appendChild(document.createTextNode(text));
  return p;
}

/* ====== 이벤트 ====== */
$("#startBtn").addEventListener("click", startGame);
$("#againBtn").addEventListener("click", startGame);
Array.prototype.forEach.call(document.querySelectorAll(".chip[data-mode]"), function(c){
  c.addEventListener("click", function(){
    mode = c.getAttribute("data-mode");
    Array.prototype.forEach.call(document.querySelectorAll(".chip[data-mode]"), function(x){
      x.setAttribute("aria-pressed", x === c ? "true" : "false");
    });
  });
});
$("#soundBtn").addEventListener("click", function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? "🔊" : "🔇";
  this.setAttribute("aria-label", soundOn ? "소리 끄기" : "소리 켜기");
});
var fsBtn = $("#fsBtn");
if (!document.fullscreenEnabled) fsBtn.hidden = true;
fsBtn.addEventListener("click", function(){
  try{
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){}
});
})();
</script>
